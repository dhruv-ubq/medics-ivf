services:
  mongo:
    image: mongo:7
    container_name: medics-ivf-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - medics-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-}
    container_name: medics-ivf-site
    restart: unless-stopped
    expose:
      - "3000"           # internal only — nginx reaches it, host cannot
    env_file:
      - .env
    networks:
      - medics-net
    depends_on:
      mongo:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: medics-ivf-nginx
    restart: unless-stopped
    ports:
      - "3434:80"        # only this port is open to the outside world
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - medics-net
    depends_on:
      - app

networks:
  medics-net:
    driver: bridge

volumes:
  mongo_data:
